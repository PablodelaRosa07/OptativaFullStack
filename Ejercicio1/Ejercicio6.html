<!DOCTYPE html>
<html lang="es">
<head>
  <title>Sexto Ejercicio</title>
</head>
<body>
    <script>

        var fecha = new Date("2007-08-21");

        var anio = fecha.getFullYear();
        var mes = fecha.getMonth()+1;
        var dia = fecha.getDate();

        document.write("Año:", anio);
        document.write("Mes:", mes);
        document.write("Día:", dia);

    </script>

</body>
</html>
