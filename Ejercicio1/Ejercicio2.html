<!DOCTYPE html>
<html lang="es">
<head>
  <title>Segundo Ejercicio</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <script>
            var letras = ['T', 'R', 'W', 'A', 'G', 'M', 'Y', 'F', 'P', 'D', 'X', 'B', 'N', 'J', 'Z', 'S', 'Q', 'V', 'H', 'L', 'C', 'K', 'E'];
            var dni = prompt("Dime tu dni: ");

            if (dni > 1 && dni < 99999999 && dni.length == 8){
                resto = dni%23;

                alert('Tu dni es: ' +dni+letras[resto]);
            }
            else {
                alert('El dni no es correcto');
            }

    </script>

</body>
</html>
