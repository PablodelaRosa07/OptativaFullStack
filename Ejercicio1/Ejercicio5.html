<!DOCTYPE html>
<html lang="es">
<head>
  <title>Quinto Ejercicio</title>
</head>
<body>
    <script>

        var lista = [];

        for (let index = 0; index < 5; index++) {
            var numero = parseInt(prompt("Introduce numero:"));
            lista.push(numero);
        }


        document.write(lista.reverse());

    </script>

</body>
</html>
