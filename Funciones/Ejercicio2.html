<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejemplo Botones con Funciones - Ejercicio 2</title>
</head>
<body>

  <button onclick="aceptar()">Aceptar</button>
  <button onclick="cancelar()">Cancelar</button>

  <label id="mensaje"></label>

  <script>
    function aceptar() {
        document.getElementById("mensaje").innerText = "Está usted aceptando";
    }

    function cancelar() {
        document.getElementById("mensaje").innerText = "Está usted cancelando"
    }  
    </script>

</body>
</html>
